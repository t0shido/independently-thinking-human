server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name independently-thinking-human.com;

    # SSL configuration managed by Certbot
    ssl_certificate /etc/letsencrypt/live/independently-thinking-human.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/independently-thinking-human.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Root directory for frontend files
    root /home/ubuntu/independently_thinking_human/frontend_dist;
    index index.html;

    # Serve frontend static files
    location / {
        try_files $uri $uri/ /index.html =404;
    }

    # Serve Django static files
    location /static/ {
        alias /home/ubuntu/independently_thinking_human/app_backend/staticfiles/;
    }

    # Serve Django media files
    location /media/ {
        alias /home/ubuntu/independently_thinking_human/app_backend/media/;
    }

    # Proxy API requests to Django
    location /api/ {
        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy admin requests to Django
    location /admin/ {
        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name independently-thinking-human.com;
    return 301 https://$host$request_uri;
}
