name: Deploy to AWS Lightsail

on:
  push:
    branches:
      - main

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: eu-central-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install AWS CLI
        run: |
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip awscliv2.zip
          sudo ./aws/install

      - name: Configure AWS credentials
        run: |
          aws configure set aws_access_key_id $AWS_ACCESS_KEY_ID
          aws configure set aws_secret_access_key $AWS_SECRET_ACCESS_KEY
          aws configure set default.region $AWS_DEFAULT_REGION

      - name: Verify AWS credentials
        run: |
          aws sts get-caller-identity

      - name: Build and push to Lightsail
        run: |
          # Get container service info
          aws lightsail get-container-services

          # Build the Docker image
          docker build -t independently-thinking-human .
          
          # Push to Lightsail
          aws lightsail push-container-image \
            --service-name independently-thinking-human \
            --label independently-thinking-human \
            --image-name independently-thinking-human

          # Deploy the container
          aws lightsail create-container-service-deployment \
            --service-name independently-thinking-human \
            --containers '{
              "independently-thinking-human": {
                "image": ":independently-thinking-human.independently-thinking-human.latest",
                "ports": {
                  "80": "HTTP",
                  "443": "HTTPS"
                }
              }
            }' \
            --public-endpoint '{
              "containerName": "independently-thinking-human",
              "containerPort": 80,
              "healthCheck": {
                "path": "/"
              }
            }'
