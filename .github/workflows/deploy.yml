name: Deploy to AWS Lightsail

on:
  push:
    branches:
      - main

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: eu-central-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install AWS CLI
        run: |
          echo "Installing AWS CLI..."
          sudo apt-get update && sudo apt-get install -y unzip
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip -q awscliv2.zip
          sudo ./aws/install --update
          aws --version
          echo "AWS CLI installed successfully"

      - name: Configure AWS credentials
        run: |
          echo "Configuring AWS credentials..."
          aws configure set aws_access_key_id $AWS_ACCESS_KEY_ID
          aws configure set aws_secret_access_key $AWS_SECRET_ACCESS_KEY
          aws configure set default.region $AWS_DEFAULT_REGION
          echo "AWS credentials configured"

      - name: Verify AWS credentials
        run: |
          echo "Verifying AWS credentials..."
          aws sts get-caller-identity
          echo "AWS credentials verified"

      - name: Check and prepare container service
        run: |
          echo "Checking container service status..."
          SERVICE_STATUS=$(aws lightsail get-container-services | jq -r '.containerServices[] | select(.containerServiceName=="independently-thinking-human") | .state')
          
          if [ "$SERVICE_STATUS" = "RUNNING" ]; then
            echo "Container service exists and is running"
          else
            echo "Creating new container service..."
            aws lightsail create-container-service \
              --service-name independently-thinking-human \
              --power small \
              --scale 1
            
            echo "Waiting for container service to be ready..."
            while true; do
              STATUS=$(aws lightsail get-container-services --service-name independently-thinking-human | jq -r '.containerServices[0].state')
              echo "Current status: $STATUS"
              if [ "$STATUS" = "RUNNING" ]; then
                break
              fi
              sleep 10
            done
          fi

      - name: Build and push to Lightsail
        run: |
          echo "Starting deployment to Lightsail..."
          
          echo "Building Docker image..."
          docker build -t independently-thinking-human:latest .
          
          echo "Pushing to Lightsail..."
          aws lightsail push-container-image \
            --service-name independently-thinking-human \
            --label latest \
            --image independently-thinking-human:latest

          # Get the image name from the push command output
          IMAGE_TAG=$(aws lightsail get-container-images --service-name independently-thinking-human | jq -r '.containerImages[0].image')
          
          echo "Creating container deployment..."
          aws lightsail create-container-service-deployment \
            --service-name independently-thinking-human \
            --containers '{
              "app": {
                "image": "'"$IMAGE_TAG"'",
                "ports": {
                  "80": "HTTP",
                  "443": "HTTPS"
                }
              }
            }' \
            --public-endpoint '{
              "containerName": "app",
              "containerPort": 80,
              "healthCheck": {
                "path": "/"
              }
            }'
          
          echo "Waiting for deployment to complete..."
          while true; do
            STATUS=$(aws lightsail get-container-services --service-name independently-thinking-human | jq -r '.containerServices[0].state')
            echo "Current status: $STATUS"
            if [ "$STATUS" = "RUNNING" ]; then
              break
            fi
            sleep 10
          done
          
          echo "Deployment completed successfully"
          URL=$(aws lightsail get-container-services --service-name independently-thinking-human | jq -r '.containerServices[0].url')
          echo "Application is available at: $URL"
