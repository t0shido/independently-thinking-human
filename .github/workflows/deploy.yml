name: Deploy to AWS Lightsail

on:
  push:
    branches:
      - main

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: eu-central-1
  INSTANCE_NAME: independently-thinking-human

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan ${{ secrets.INSTANCE_IP }} >> ~/.ssh/known_hosts

      - name: Build and deploy
        env:
          INSTANCE_IP: ${{ secrets.INSTANCE_IP }}
        run: |
          # Build the Docker image
          docker build -t independently-thinking-human:latest .
          
          # Save the image to a tar file
          docker save independently-thinking-human:latest > image.tar
          
          # Copy the image to the server
          scp image.tar ubuntu@${INSTANCE_IP}:~/image.tar
          
          # Deploy using SSH
          ssh ubuntu@${INSTANCE_IP} << 'ENDSSH'
            # Load the image
            docker load < image.tar
            
            # Stop existing container if it exists
            docker stop independently-thinking-human || true
            docker rm independently-thinking-human || true
            
            # Run the new container
            docker run -d \
              --name independently-thinking-human \
              --restart unless-stopped \
              -p 80:80 \
              -p 443:443 \
              independently-thinking-human:latest
            
            # Clean up
            rm image.tar
          ENDSSH
