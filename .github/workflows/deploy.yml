name: Deploy to AWS Lightsail

on:
  push:
    branches:
      - main

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: eu-central-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install AWS CLI
        run: |
          echo "Installing AWS CLI..."
          sudo apt-get update && sudo apt-get install -y unzip
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip -q awscliv2.zip
          sudo ./aws/install --update
          aws --version
          echo "AWS CLI installed successfully"

      - name: Configure AWS credentials
        run: |
          echo "Configuring AWS credentials..."
          aws configure set aws_access_key_id $AWS_ACCESS_KEY_ID
          aws configure set aws_secret_access_key $AWS_SECRET_ACCESS_KEY
          aws configure set default.region $AWS_DEFAULT_REGION
          echo "AWS credentials configured"

      - name: Verify AWS credentials
        run: |
          echo "Verifying AWS credentials..."
          aws sts get-caller-identity
          echo "AWS credentials verified"

      - name: Build and push to Lightsail
        run: |
          echo "Starting deployment to Lightsail..."
          
          echo "Getting container service info..."
          aws lightsail get-container-services

          echo "Building Docker image..."
          docker build -t independently-thinking-human .
          
          echo "Pushing to Lightsail..."
          aws lightsail push-container-image \
            --service-name independently-thinking-human \
            --label independently-thinking-human \
            --image-name independently-thinking-human

          echo "Creating container deployment..."
          aws lightsail create-container-service-deployment \
            --service-name independently-thinking-human \
            --containers '{
              "independently-thinking-human": {
                "image": ":independently-thinking-human.independently-thinking-human.latest",
                "ports": {
                  "80": "HTTP",
                  "443": "HTTPS"
                }
              }
            }' \
            --public-endpoint '{
              "containerName": "independently-thinking-human",
              "containerPort": 80,
              "healthCheck": {
                "path": "/"
              }
            }'
          
          echo "Deployment completed successfully"
