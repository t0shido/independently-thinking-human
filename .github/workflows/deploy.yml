name: Deploy to Lightsail

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    # Manual trigger option

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci
      
      - name: Build frontend
        run: npm run build
        
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: Install backend dependencies
        working-directory: ./django_backend
        run: pip install -r requirements.txt
      
      - name: Deploy to Lightsail
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_KEY }}
          port: ${{ secrets.LIGHTSAIL_PORT || 22 }}
          script_stop: true
          script: |
            echo "Starting deployment at $(date)"
            
            # Navigate to project directory
            cd /home/ubuntu/independently-thinking-human
            
            # Pull latest changes
            git pull origin main
            
            # Frontend deployment
            echo "Deploying frontend..."
            npm ci
            npm run build
            
            # Backend deployment
            echo "Deploying backend..."
            cd django_backend
            
            # Create/activate virtual environment if needed
            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi
            source venv/bin/activate
            
            # Install dependencies
            pip install -r requirements.txt
            
            # Set production environment variables
            export DEBUG=False
            export ALLOWED_HOSTS="${{ secrets.ALLOWED_HOSTS }}"
            
            # Run migrations
            python manage.py migrate --no-input
            
            # Collect static files
            python manage.py collectstatic --no-input
            
            # Restart services
            cd ..
            
            # Restart Django using Gunicorn (if configured)
            if systemctl is-active --quiet gunicorn; then
              sudo systemctl restart gunicorn
            fi
            
            # Restart Node.js server
            if pm2 list | grep -q independently-thinking-human; then
              pm2 restart independently-thinking-human
            elif systemctl is-active --quiet independently-thinking-human; then
              sudo systemctl restart independently-thinking-human
            else
              echo "Warning: Could not find service to restart. Starting with PM2..."
              pm2 start server.cjs --name independently-thinking-human
            fi
            
            # Reload Nginx
            sudo systemctl reload nginx
            
            echo "Deployment completed at $(date)"
