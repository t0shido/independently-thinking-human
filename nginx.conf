server {
    listen 80;
    server_name _;  # Accept any domain for initial setup
    
    # For production, replace with your actual domain:
    # server_name your-domain.com www.your-domain.com;
    # return 301 https://$host$request_uri;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
}

    # Serve Django static files (collected)
    location /static/ {
        alias /home/ubuntu/independently_thinking_human/django_backend/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # Serve Django media files (uploads)
    location /media/ {
        alias /home/ubuntu/independently_thinking_human/django_backend/media/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Proxy Django API to Gunicorn via Unix socket
    location /api/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://unix:/run/gunicorn/socket;
    }

    # Serve the frontend SPA at root
    location / {
        root /home/ubuntu/independently_thinking_human/frontend_dist;
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }
}
