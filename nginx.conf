server {
    listen 80;
    server_name independently-thinking-human.com www.independently-thinking-human.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name independently-thinking-human.com www.independently-thinking-human.com;

    # SSL certificates (issued by Certbot/Let’s Encrypt)
    ssl_certificate /etc/letsencrypt/live/independently-thinking-human.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/independently-thinking-human.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Serve Django static files (collected)
    location /static/ {
        alias /home/ubuntu/independently_thinking_human/django_backend/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # Serve Django media files (uploads)
    location /media/ {
        alias /home/ubuntu/independently_thinking_human/django_backend/media/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Serve the SPA build at root
    location / {
        root /home/ubuntu/independently_thinking_human/frontend_dist;
        try_files $uri /index.html;
        expires 1h;
    }

    # Proxy Django API to Gunicorn via Unix socket
    location /api/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://unix:/home/ubuntu/independently_thinking_human/django_backend/gunicorn.sock;
    }
}
