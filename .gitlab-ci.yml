stages:
  - build
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  FRONTEND_DIR: "."
  BACKEND_DIR: "django_backend"
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.10"
  # Default deployment path - can be overridden in GitLab variables
  PRODUCTION_PATH: "/home/ubuntu/independently_thinking_human"
  PRODUCTION_USER: "ubuntu"

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/
    - ${BACKEND_DIR}/venv/

# Lint and test stages have been removed

frontend:build:
  stage: build
  image: node:${NODE_VERSION}
  script:
    - cd ${FRONTEND_DIR}
    - npm ci
    - npm run build
  artifacts:
    paths:
      - ${FRONTEND_DIR}/dist/
    expire_in: 1 week
  only:
    - main

backend:build:
  stage: build
  image: python:${PYTHON_VERSION}
  script:
    - cd ${BACKEND_DIR}
    - pip install virtualenv
    - virtualenv venv
    - source venv/bin/activate
    - pip install -r requirements.txt
    - python manage.py collectstatic --noinput
    - python manage.py check --deploy
  artifacts:
    paths:
      - ${BACKEND_DIR}/staticfiles/
    expire_in: 1 week
  only:
    - main

deploy:production:
  stage: deploy
  image: alpine:latest
  needs: ["frontend:build", "backend:build"]
  before_script:
    - apk add --no-cache openssh-client rsync
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - echo "🚀 Starting fully automated deployment..."
    
    # Create automated deployment script
    - |
      cat > auto_deploy.sh <<'DEPLOY_SCRIPT'
      #!/bin/bash
      set -e
      
      # Colors for output
      RED='\033[0;31m'
      GREEN='\033[0;32m'
      YELLOW='\033[1;33m'
      NC='\033[0m' # No Color
      
      echo -e "${GREEN}🔧 Starting automated server setup...${NC}"
      
      # Update system packages
      echo -e "${YELLOW}📦 Updating system packages...${NC}"
      sudo apt-get update -qq
      sudo apt-get upgrade -y
      
      # Install required packages
      echo -e "${YELLOW}📋 Installing required packages...${NC}"
      sudo apt-get install -y \
        python3 \
        python3-pip \
        python3-venv \
        python3-dev \
        postgresql \
        postgresql-contrib \
        nginx \
        git \
        curl \
        build-essential \
        libpq-dev
      
      # Create project directory
      echo -e "${YELLOW}📁 Setting up project directory...${NC}"
      sudo mkdir -p $PRODUCTION_PATH
      sudo chown -R $PRODUCTION_USER:$PRODUCTION_USER $PRODUCTION_PATH
      cd $PRODUCTION_PATH
      
      # Setup PostgreSQL automatically
      echo -e "${YELLOW}🗄️ Setting up PostgreSQL...${NC}"
      sudo systemctl start postgresql
      sudo systemctl enable postgresql
      
      # Generate secure database password
      DB_PASSWORD=$(openssl rand -base64 32)
      DB_NAME="independently_thinking_human"
      DB_USER="app_user"
      
      # Create database and user
      sudo -u postgres psql <<EOF
      SELECT 'CREATE DATABASE $DB_NAME' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '$DB_NAME')\gexec
      DO \$\$
      BEGIN
         IF NOT EXISTS (SELECT FROM pg_catalog.pg_user WHERE usename = '$DB_USER') THEN
            CREATE USER $DB_USER WITH PASSWORD '$DB_PASSWORD';
         ELSE
            ALTER USER $DB_USER WITH PASSWORD '$DB_PASSWORD';
         END IF;
      END
      \$\$;
      GRANT ALL PRIVILEGES ON DATABASE $DB_NAME TO $DB_USER;
      ALTER USER $DB_USER CREATEDB;
      EOF
      
      # Configure PostgreSQL authentication
      PG_HBA_PATH=$(sudo -u postgres psql -t -c "SHOW hba_file;" | xargs)
      sudo cp "$PG_HBA_PATH" "$PG_HBA_PATH.backup"
      if ! sudo grep -q "host.*$DB_NAME.*$DB_USER.*127.0.0.1/32.*md5" "$PG_HBA_PATH"; then
          echo "host    $DB_NAME    $DB_USER    127.0.0.1/32    md5" | sudo tee -a "$PG_HBA_PATH"
      fi
      sudo systemctl reload postgresql
      
      # Create .env file with secure settings
      echo -e "${YELLOW}⚙️ Creating secure environment configuration...${NC}"
      mkdir -p django_backend
      cat > django_backend/.env <<ENV_EOF
      DJANGO_SECRET_KEY=$DJANGO_SECRET_KEY
      DEBUG=False
      DJANGO_ALLOWED_HOSTS=$DJANGO_ALLOWED_HOSTS
      CSRF_TRUSTED_ORIGINS=$CSRF_TRUSTED_ORIGINS
      DATABASE_URL=postgresql://$DB_USER:$DB_PASSWORD@localhost:5432/$DB_NAME
      MEDIA_URL=/media/
      ENV_EOF
      
      echo -e "${GREEN}✅ Server setup completed successfully!${NC}"
      DEPLOY_SCRIPT
    
    # Upload and execute the deployment script
    - chmod +x auto_deploy.sh
    - scp auto_deploy.sh $PRODUCTION_USER@$PRODUCTION_SERVER:/tmp/auto_deploy.sh
    - ssh $PRODUCTION_USER@$PRODUCTION_SERVER "chmod +x /tmp/auto_deploy.sh && PRODUCTION_PATH=$PRODUCTION_PATH PRODUCTION_USER=$PRODUCTION_USER DJANGO_SECRET_KEY='$DJANGO_SECRET_KEY' DJANGO_ALLOWED_HOSTS='$DJANGO_ALLOWED_HOSTS' CSRF_TRUSTED_ORIGINS='$CSRF_TRUSTED_ORIGINS' /tmp/auto_deploy.sh"
    
    # Deploy application files
    - echo "📂 Deploying application files..."
    - rsync -az --delete ${FRONTEND_DIR}/dist/ $PRODUCTION_USER@$PRODUCTION_SERVER:$PRODUCTION_PATH/frontend_dist/
    - rsync -az --delete ${BACKEND_DIR}/ $PRODUCTION_USER@$PRODUCTION_SERVER:$PRODUCTION_PATH/app_backend/
    
    # Deploy configuration files
    - echo "⚙️ Deploying configuration files..."
    - rsync -az nginx/independently-thinking-human.conf $PRODUCTION_USER@$PRODUCTION_SERVER:/tmp/nginx.conf
    - rsync -az systemd/ $PRODUCTION_USER@$PRODUCTION_SERVER:/tmp/systemd/
    # Complete the application deployment
    - |
      cat > app_deploy.sh <<'APP_SCRIPT'
      #!/bin/bash
      set -e
      
      echo "🐍 Setting up Python application..."
      # Use a different directory name to avoid GitLab masking
      cd $PRODUCTION_PATH/app_backend
      
      # Debug directory structure if there's an issue
      if [ ! -d "$PRODUCTION_PATH/app_backend" ]; then
        echo "Error: Backend directory not found"
        echo "Contents of $PRODUCTION_PATH:"
        ls -la $PRODUCTION_PATH
        exit 1
      fi
      
      # Check Python version and location
      echo "Python version:"
      python3 --version
      which python3
      
      # Create virtual environment with better error handling
      echo "Creating virtual environment..."
      if [ -d "venv" ]; then
        echo "Removing existing virtual environment"
        rm -rf venv
      fi
      
      python3 -m venv venv
      
      # Verify venv was created
      if [ ! -f "venv/bin/python3" ]; then
        echo "Error: Virtual environment creation failed!"
        echo "Checking venv directory:"
        ls -la venv
        echo "Trying alternative approach..."
        python3 -m pip install virtualenv
        python3 -m virtualenv venv
      fi
      
      # Install dependencies
      echo "Installing dependencies..."
      venv/bin/pip install --upgrade pip
      venv/bin/pip install -r requirements.txt
      echo "Installing Gunicorn..."
      venv/bin/pip install gunicorn
      
      # Create .env file with environment variables
      echo "🔧 Creating .env file..."
      echo "DJANGO_SECRET_KEY='${DJANGO_SECRET_KEY}'" > .env
      echo "DJANGO_ALLOWED_HOSTS='${DJANGO_ALLOWED_HOSTS}'" >> .env
      echo "CSRF_TRUSTED_ORIGINS='${CSRF_TRUSTED_ORIGINS}'" >> .env
      echo "DEBUG=${DEBUG}" >> .env
      echo "DATABASE_URL='${DATABASE_URL_WITH_PASSWORD}'" >> .env
      
      # Run Django setup
      echo "🔧 Running Django migrations and static files..."
      ./venv/bin/python manage.py migrate --noinput
      ./venv/bin/python manage.py collectstatic --noinput
      
      # Configure Nginx
      echo "🌐 Configuring Nginx..."
      sudo mv /tmp/nginx.conf /etc/nginx/sites-available/independently_thinking_human
      sudo ln -sf /etc/nginx/sites-available/independently_thinking_human /etc/nginx/sites-enabled/
      sudo rm -f /etc/nginx/sites-enabled/default
      sudo nginx -t
      
      # Configure systemd services
      echo "⚙️ Setting up systemd services..."
      sudo mv /tmp/systemd/*.service /etc/systemd/system/
      sudo systemctl daemon-reload
      
      # Debug checks
      echo "🔍 Debugging checks..."
      echo "Checking for wsgi.py file..."
      ls -la $PRODUCTION_PATH/app_backend/blog_backend/
      echo "Checking Python path..."
      echo "PYTHONPATH=$PYTHONPATH"
      
      # Start services
      echo "🚀 Starting services..."
      sudo systemctl enable gunicorn
      sudo systemctl start gunicorn || {
        echo "❌ Gunicorn service failed to start. Checking logs..."
        sudo journalctl -xeu gunicorn.service --no-pager | tail -n 50
      }
      sudo systemctl enable nginx
      sudo systemctl restart nginx
      
      echo "✅ Deployment completed successfully!"
      echo "🌍 Your application should be available at your server's IP address"
      APP_SCRIPT
    
    - chmod +x app_deploy.sh
    - scp app_deploy.sh $PRODUCTION_USER@$PRODUCTION_SERVER:/tmp/app_deploy.sh
    - ssh $PRODUCTION_USER@$PRODUCTION_SERVER "chmod +x /tmp/app_deploy.sh && PRODUCTION_PATH=$PRODUCTION_PATH DJANGO_SECRET_KEY='$DJANGO_SECRET_KEY' DJANGO_ALLOWED_HOSTS='$DJANGO_ALLOWED_HOSTS' CSRF_TRUSTED_ORIGINS='$CSRF_TRUSTED_ORIGINS' DEBUG=$DEBUG DATABASE_URL_WITH_PASSWORD='$DATABASE_URL_WITH_PASSWORD' /tmp/app_deploy.sh"

  when: manual
  only:
    - main
  environment:
    name: production
    url: https://your-domain.com
