stages:
  - lint
  - test
  - build
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  FRONTEND_DIR: "."
  BACKEND_DIR: "django_backend"
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.10"

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/
    - ${BACKEND_DIR}/venv/

frontend:lint:
  stage: lint
  image: node:${NODE_VERSION}
  script:
    - cd ${FRONTEND_DIR}
    - npm ci
    - npx eslint .
  only:
    changes:
      - "*.js"
      - "*.jsx"
      - "*.json"
      - "src/**/*"
      - "public/**/*"
      - "package.json"
      - "package-lock.json"

backend:lint:
  stage: lint
  image: python:${PYTHON_VERSION}
  script:
    - cd ${BACKEND_DIR}
    - pip install virtualenv
    - virtualenv venv
    - source venv/bin/activate
    - pip install -r requirements.txt
    - pip install flake8
    - flake8 .
  only:
    changes:
      - "${BACKEND_DIR}/**/*"
      - "${BACKEND_DIR}/requirements.txt"

frontend:test:
  stage: test
  image: node:${NODE_VERSION}
  script:
    - cd ${FRONTEND_DIR}
    - npm ci
    - npm test -- --passWithNoTests
  only:
    changes:
      - "*.js"
      - "*.jsx"
      - "src/**/*"
      - "package.json"
      - "package-lock.json"

backend:test:
  stage: test
  image: python:${PYTHON_VERSION}
  services:
    - postgres:latest
  variables:
    POSTGRES_DB: test_db
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/test_db"
  script:
    - cd ${BACKEND_DIR}
    - pip install virtualenv
    - virtualenv venv
    - source venv/bin/activate
    - pip install -r requirements.txt
    - python manage.py test
  only:
    changes:
      - "${BACKEND_DIR}/**/*"
      - "${BACKEND_DIR}/requirements.txt"

frontend:build:
  stage: build
  image: node:${NODE_VERSION}
  script:
    - cd ${FRONTEND_DIR}
    - npm ci
    - npm run build
  artifacts:
    paths:
      - ${FRONTEND_DIR}/dist/
    expire_in: 1 week
  only:
    - main

backend:build:
  stage: build
  image: python:${PYTHON_VERSION}
  script:
    - cd ${BACKEND_DIR}
    - pip install virtualenv
    - virtualenv venv
    - source venv/bin/activate
    - pip install -r requirements.txt
    - python manage.py collectstatic --noinput
    - python manage.py check --deploy
  artifacts:
    paths:
      - ${BACKEND_DIR}/staticfiles/
    expire_in: 1 week
  only:
    - main

deploy:production:
  stage: deploy
  image: alpine:latest
  needs: ["frontend:build", "backend:build"]
  before_script:
    - apk add --no-cache openssh-client rsync
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
    # Create a .env locally from CI variables and upload to server
    - |
      cat > .env.deploy <<EOF2
      DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      DEBUG=${DEBUG}
      DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS}
      CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS}
      DATABASE_URL=${DATABASE_URL}
      EOF2
    # Create all necessary directories on the server with proper permissions
    - ssh $PRODUCTION_USER@$PRODUCTION_SERVER "mkdir -p $PRODUCTION_PATH/django_backend $PRODUCTION_PATH/frontend_dist && sudo chown -R $PRODUCTION_USER:$PRODUCTION_USER $PRODUCTION_PATH && sudo chmod -R 755 $PRODUCTION_PATH"
    - scp .env.deploy $PRODUCTION_USER@$PRODUCTION_SERVER:$PRODUCTION_PATH/django_backend/.env
    # Debug: Check DATABASE_URL format (showing only the structure, not credentials)
    - ssh $PRODUCTION_USER@$PRODUCTION_SERVER "grep 'DATABASE_URL' $PRODUCTION_PATH/django_backend/.env | sed -E 's/(.+:\/\/).+:.+@(.+)/\1USERNAME:PASSWORD@\2/'"
    # Debug: Check file permissions on .env file
    - ssh $PRODUCTION_USER@$PRODUCTION_SERVER "ls -la $PRODUCTION_PATH/django_backend/.env"
    - rm -f .env.deploy
  script:
    - echo "Deploying frontend (dist/) and Django backend to production server..."
    # Create all necessary directories with proper permissions
    - ssh $PRODUCTION_USER@$PRODUCTION_SERVER "sudo mkdir -p $PRODUCTION_PATH $PRODUCTION_PATH/django_backend/{staticfiles,media} $PRODUCTION_PATH/frontend_dist && sudo chown -R $PRODUCTION_USER:$PRODUCTION_USER $PRODUCTION_PATH && sudo chmod -R 755 $PRODUCTION_PATH || true"
    - rsync -az --delete ${FRONTEND_DIR}/dist/ $PRODUCTION_USER@$PRODUCTION_SERVER:$PRODUCTION_PATH/frontend_dist/
    - rsync -az --delete ${BACKEND_DIR}/ $PRODUCTION_USER@$PRODUCTION_SERVER:$PRODUCTION_PATH/django_backend/
    - |
      ssh $PRODUCTION_USER@$PRODUCTION_SERVER "
        cd $PRODUCTION_PATH/django_backend &&
        sudo apt-get update && sudo apt-get install -y python3-venv python3-full &&
        rm -rf venv &&
        python3 -m venv venv &&
        ./venv/bin/pip install --upgrade pip &&
        ./venv/bin/pip install -r requirements.txt &&
        ./venv/bin/python manage.py collectstatic --noinput &&
        # Check if .env file exists and has DATABASE_URL
        if grep -q 'DATABASE_URL' .env; then
          echo 'Using database configuration from .env file'
          # Debug: Show .env file content with credentials masked
          echo "Content of .env file (credentials masked):"
          cat .env | sed -E 's/(DATABASE_URL=.+:/\/).+:.+@(.+)/\1USERNAME:PASSWORD@\2/'
          
          # Debug: Print database URL and test connection
          echo "Checking DATABASE_URL environment variable"
          ./venv/bin/python -c "import os; db_url = os.environ.get('DATABASE_URL', 'Not found'); print('DATABASE_URL: ' + (db_url.replace(db_url.split('@')[0], '[CREDENTIALS_MASKED]') if '@' in db_url else db_url))" || echo 'Failed to check DATABASE_URL'
          
          # Debug: Test direct database connection with proper quoting and explicit parameters
          ./venv/bin/python -c "import os, psycopg2, urllib.parse; print('Testing database connection'); \
          db_url = os.environ['DATABASE_URL']; \
          parsed = urllib.parse.urlparse(db_url); \
          print('Host: ' + str(parsed.hostname) + ', Port: ' + str(parsed.port) + ', DB: ' + parsed.path[1:]); \
          try: \
              conn = psycopg2.connect(db_url); \
              print('Connection successful!'); \
              conn.close(); \
          except Exception as e: \
              print('Connection error: ' + str(e))" || echo 'Direct connection failed'
          # Debug: Check Django's database settings
          ./venv/bin/python -c "import os, sys, django; sys.path.append('.'); os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'blog_backend.settings'); django.setup(); from django.conf import settings; print('Django DATABASE settings:', settings.DATABASES['default']['ENGINE'], settings.DATABASES['default']['HOST'], settings.DATABASES['default']['PORT'])" || echo 'Failed to check Django settings'
          
          # Debug: Try running migrations with verbose output
          ./venv/bin/python manage.py migrate --verbosity 3 --noinput || echo 'Migration failed but continuing deployment'
        else
          echo 'Warning: DATABASE_URL not found in .env file, skipping migrations'
        fi &&
        sudo systemctl restart gunicorn &&
        sudo systemctl reload nginx
      "
  when: manual
  only:
    - main
  environment:
    name: production
    url: https://your-domain.com
