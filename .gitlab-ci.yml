stages:
  - lint
  - test
  - build
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  FRONTEND_DIR: "."
  BACKEND_DIR: "django_backend"
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.10"

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/
    - ${BACKEND_DIR}/venv/

frontend:lint:
  stage: lint
  image: node:${NODE_VERSION}
  script:
    - cd ${FRONTEND_DIR}
    - npm ci
    - npx eslint .
  only:
    changes:
      - "*.js"
      - "*.jsx"
      - "*.json"
      - "src/**/*"
      - "public/**/*"
      - "package.json"
      - "package-lock.json"

backend:lint:
  stage: lint
  image: python:${PYTHON_VERSION}
  script:
    - cd ${BACKEND_DIR}
    - pip install virtualenv
    - virtualenv venv
    - source venv/bin/activate
    - pip install -r requirements.txt
    - pip install flake8
    - flake8 .
  only:
    changes:
      - "${BACKEND_DIR}/**/*"
      - "${BACKEND_DIR}/requirements.txt"

frontend:test:
  stage: test
  image: node:${NODE_VERSION}
  script:
    - cd ${FRONTEND_DIR}
    - npm ci
    - npm test -- --passWithNoTests
  only:
    changes:
      - "*.js"
      - "*.jsx"
      - "src/**/*"
      - "package.json"
      - "package-lock.json"

backend:test:
  stage: test
  image: python:${PYTHON_VERSION}
  services:
    - postgres:latest
  variables:
    POSTGRES_DB: test_db
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    DATABASE_URL: "postgresql://postgres:${DB_PASSWORD}@localhost:5432/postgres"
  script:
    - cd ${BACKEND_DIR}
    - pip install virtualenv
    - virtualenv venv
    - source venv/bin/activate
    - pip install -r requirements.txt
    - python manage.py test
  only:
    changes:
      - "${BACKEND_DIR}/**/*"
      - "${BACKEND_DIR}/requirements.txt"

frontend:build:
  stage: build
  image: node:${NODE_VERSION}
  script:
    - cd ${FRONTEND_DIR}
    - npm ci
    - npm run build
  artifacts:
    paths:
      - ${FRONTEND_DIR}/dist/
    expire_in: 1 week
  only:
    - main

backend:build:
  stage: build
  image: python:${PYTHON_VERSION}
  script:
    - cd ${BACKEND_DIR}
    - pip install virtualenv
    - virtualenv venv
    - source venv/bin/activate
    - pip install -r requirements.txt
    - python manage.py collectstatic --noinput
    - python manage.py check --deploy
  artifacts:
    paths:
      - ${BACKEND_DIR}/staticfiles/
    expire_in: 1 week
  only:
    - main

deploy:production:
  stage: deploy
  image: alpine:latest
  needs: ["frontend:build", "backend:build"]
  before_script:
    - apk add --no-cache openssh-client rsync
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
    # Create a .env locally from CI variables and upload to server
    - |
      cat > .env.deploy <<EOF2
      # Django settings
      SECRET_KEY=${DJANGO_SECRET_KEY}
      DEBUG=${DEBUG}
      ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS}
      CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS}
      # Database settings - using postgres user and database
      DATABASE_URL=${DATABASE_URL_WITH_PASSWORD:-postgresql://postgres:postgres@localhost:5432/postgres}
      # Media settings
      MEDIA_URL=/media/
      EOF2
    # Create all necessary directories on the server with proper permissions
    - ssh $PRODUCTION_USER@$PRODUCTION_SERVER "mkdir -p $PRODUCTION_PATH/django_backend $PRODUCTION_PATH/frontend_dist && sudo chown -R $PRODUCTION_USER:$PRODUCTION_USER $PRODUCTION_PATH && sudo chmod -R 755 $PRODUCTION_PATH"
    - scp .env.deploy $PRODUCTION_USER@$PRODUCTION_SERVER:$PRODUCTION_PATH/django_backend/.env
    # Debug: Check DATABASE_URL format (showing only the structure, not credentials)
    - ssh $PRODUCTION_USER@$PRODUCTION_SERVER "grep 'DATABASE_URL' $PRODUCTION_PATH/django_backend/.env | sed -E 's/(.+:\/\/).+:.+@(.+)/\1USERNAME:PASSWORD@\2/'"
    # Debug: Check file permissions on .env file
    - ssh $PRODUCTION_USER@$PRODUCTION_SERVER "ls -la $PRODUCTION_PATH/django_backend/.env"
    - rm -f .env.deploy
  script:
    - echo "Deploying frontend (dist/) and Django backend to production server..."
    # Create scripts directory for deployment scripts
    - mkdir -p scripts
    # Deploy Nginx configuration
    - echo "Deploying Nginx configuration..."
    - ssh $PRODUCTION_USER@$PRODUCTION_SERVER "sudo mkdir -p /etc/nginx/sites-available"
    - scp nginx/independently-thinking-human.conf $PRODUCTION_USER@$PRODUCTION_SERVER:$PRODUCTION_PATH/nginx-config.conf
    - ssh $PRODUCTION_USER@$PRODUCTION_SERVER "sudo cp $PRODUCTION_PATH/nginx-config.conf /etc/nginx/sites-available/independently-thinking-human && sudo ln -sf /etc/nginx/sites-available/independently-thinking-human /etc/nginx/sites-enabled/ && sudo rm -f /etc/nginx/sites-enabled/default && sudo nginx -t && sudo systemctl restart nginx"
    # Copy diagnostic scripts
    - rsync -az scripts/ $PRODUCTION_USER@$PRODUCTION_SERVER:$PRODUCTION_PATH/scripts/
    # Create all necessary directories with proper permissions
    - ssh $PRODUCTION_USER@$PRODUCTION_SERVER "sudo mkdir -p $PRODUCTION_PATH $PRODUCTION_PATH/django_backend/{staticfiles,media} $PRODUCTION_PATH/frontend_dist && sudo chown -R $PRODUCTION_USER:$PRODUCTION_USER $PRODUCTION_PATH && sudo chmod -R 755 $PRODUCTION_PATH || true"
    - rsync -az --delete ${FRONTEND_DIR}/dist/ $PRODUCTION_USER@$PRODUCTION_SERVER:$PRODUCTION_PATH/frontend_dist/
    - rsync -az --delete ${BACKEND_DIR}/ $PRODUCTION_USER@$PRODUCTION_SERVER:$PRODUCTION_PATH/django_backend/
    - ssh $PRODUCTION_USER@$PRODUCTION_SERVER "cd $PRODUCTION_PATH && chmod +x scripts/*.py"
    # Create a deployment script to run on the server
    - |
      cat > deploy.sh <<'EOFSCRIPT'
      #!/bin/bash
      set -e
      cd $PRODUCTION_PATH/django_backend
      echo "Installing dependencies..."
      sudo apt-get update && sudo apt-get install -y python3-venv python3-full
      echo "Setting up Python virtual environment..."
      rm -rf venv
      python3 -m venv venv
      ./venv/bin/pip install --upgrade pip
      ./venv/bin/pip install -r requirements.txt
      echo "Collecting static files..."
      ./venv/bin/python manage.py collectstatic --noinput
      
      # Ensure .env file exists
      if [ ! -f .env ]; then
        echo 'ERROR: .env file not found!'
        exit 1
      fi
      
      # Check for database configuration
      echo 'Content of .env file (credentials masked):'
      cat .env | grep -v "PASSWORD\|SECRET" || cat .env | sed -E 's/(DATABASE_URL=.+:\/\/).+:.+@(.+)/\1USERNAME:PASSWORD@\2/'
      
      # Check if DATABASE_URL exists in the .env file
      if grep -q 'DATABASE_URL' .env; then
        echo 'Using database configuration from .env file'
        
        # Export environment variables from .env to make them available to Python scripts
        export $(grep -v '^#' .env | xargs)
        
        echo 'Checking DATABASE_URL environment variable'
        ./venv/bin/python ../scripts/check_db_url.py
        
        echo 'Testing database connection'
        ./venv/bin/python ../scripts/test_db_connection.py
        
        echo 'Checking Django settings'
        ./venv/bin/python ../scripts/check_django_settings.py
        
        # Check PostgreSQL connection directly
        echo 'Testing PostgreSQL connection directly'
        if command -v psql &> /dev/null; then
          DB_URL=$(grep DATABASE_URL .env | cut -d '=' -f2-)
          if [[ $DB_URL == postgresql://* ]]; then
            DB_USER=$(echo $DB_URL | sed -E 's/postgresql:\/\/([^:]+).*/\1/')
            DB_HOST=$(echo $DB_URL | sed -E 's/.*@([^:]+).*/\1/')
            DB_NAME=$(echo $DB_URL | sed -E 's/.*\/([^?]+).*/\1/')
            echo "Attempting direct psql connection as $DB_USER to $DB_HOST/$DB_NAME"
            PGPASSWORD=$(echo $DB_URL | sed -E 's/.*:([^@]+)@.*/\1/') psql -U $DB_USER -h $DB_HOST -d $DB_NAME -c "\l" || echo "Direct psql connection failed"
          else
            echo "DATABASE_URL not in expected postgresql:// format"
          fi
        else
          echo "psql command not available"
        fi
        
        echo 'Running migrations'
        ./venv/bin/python manage.py migrate --verbosity 3 --noinput || echo 'Migration failed but continuing deployment'
      else
        echo 'ERROR: DATABASE_URL not found in .env file, skipping migrations'
      fi
      
      echo "Restarting services..."
      sudo systemctl restart gunicorn
      sudo systemctl reload nginx
      echo "Deployment completed."
      EOFSCRIPT
    - chmod +x deploy.sh
    - scp deploy.sh $PRODUCTION_USER@$PRODUCTION_SERVER:$PRODUCTION_PATH/deploy.sh
    - ssh $PRODUCTION_USER@$PRODUCTION_SERVER "cd $PRODUCTION_PATH && chmod +x deploy.sh && PRODUCTION_PATH=$PRODUCTION_PATH ./deploy.sh"

  when: manual
  only:
    - main
  environment:
    name: production
    url: https://your-domain.com
