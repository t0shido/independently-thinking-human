<!DOCTYPE html>
<html>
<head>
    <title>CORS Test</title>
</head>
<body>
    <h1>CORS Test</h1>
    <button id="testButton">Test API Connection</button>
    <div id="result"></div>

    <script>
        document.getElementById('testButton').addEventListener('click', async () => {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Testing connection...';
            
            try {
                const response = await fetch('http://127.0.0.1:8000/api/articles/mindset/');
                if (response.ok) {
                    const data = await response.json();
                    resultDiv.innerHTML = `Success! Found ${data.length} articles in mindset section.`;
                    console.log('API Response:', data);
                } else {
                    resultDiv.innerHTML = `Error: ${response.status} ${response.statusText}`;
                }
            } catch (error) {
                resultDiv.innerHTML = `Connection error: ${error.message}`;
                console.error('Error:', error);
            }
        });
    </script>
</body>
</html>
